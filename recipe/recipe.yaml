schema_version: 1

context:
  name: simplegmail
  version: "5.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/simplegmail-${{ version }}.tar.gz
  sha256: 92b7e2cc48f40b4727214cd9fe46a6490df8e5d9dffcc9f8d636f1935408d338

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - pytest-runner
    - python ${{ python_min }}.*
    - setuptools
  run:
    - beautifulsoup4
    - google-auth-oauthlib
    - google-api-python-client >=1.7.3
    - lxml >=4.4.2
    - oauth2client >=4.1.3
    - python >=${{ python_min }}
    - python-dateutil >=2.8.1

tests:
  - python:
      imports:
        - simplegmail
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: A simple Python API client for Gmail.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/jeremyephron/simplegmail

extra:
  recipe-maintainers:
    - jan-janssen
